apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccount.cd.name }}-admin-binding
  namespace: {{ include "homework.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: admin
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.cd.name }}
    namespace: {{ include "homework.namespace" . }}