apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.serviceAccount.monitoring.name }}-metrics-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.serviceAccount.monitoring.name }}-metrics
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.monitoring.name }}
  namespace: {{ include "homework.namespace" . }}