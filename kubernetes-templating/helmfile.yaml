repositories:
  - name: bitnami
    url: https://mirror.yandex.ru/helm/charts.bitnami.com

releases:
  - name: kafka-prod
    namespace: prod
    chart: bitnami/kafka
    version: 32.1.3
    createNamespace: true
    set:
      - name: namespaceOverride
        value: "prod"
      - name: broker.replicaCount
        value: 5
      - name: image.tag
        value: 3.5.2
      - name: listeners.client.protocol # следующие 2 параметра установлены по умолчанию, можно не указывать. Прописаны для надежности.
        value: SASL_PLAINTEXT
      - name: listeners.interbroker.protocol
        value: SASL_PLAINTEXT

  - name: kafka-dev
    namespace: dev
    chart: bitnami/kafka
    version: 32.1.3
    createNamespace: true
    values:
      - namespaceOverride: dev
      - image.tag: latest 
      - broker:
          replicaCount: 1
      - listeners:
          client:
            protocol: PLAINTEXT
            name: CLIENT
          interbroker:
            protocol: PLAINTEXT 
            name: INTERNAL